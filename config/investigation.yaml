# Sutram Investigator — investigation layer configuration
# The analytics core keeps using config/config.yaml; this file controls the
# case workspace, retrieval/assistant defaults and optional LLM polish.
investigation:
  case_root: "data/cases"
  language: "en"

  # analytics thresholds passed to the aml pipeline
  min_events_per_entity: 30
  tol_minutes: 25
  structuring_threshold: 10000.0
  top_k: 10
  max_findings: 25

  # LLM provider: cloudflare | openai | ollama | none.
  # Cloudflare credentials are read from .env:
  #   Account ID=...   (or CLOUDFLARE_ACCOUNT_ID)
  #   API KEY=...      (or CLOUDFLARE_API_TOKEN)
  # The vision model reads uploaded images; the text model polishes grounded
  # answers; the image model generates illustrations on request.
  llm_provider: "cloudflare"
  llm_model: "@cf/meta/llama-3.2-11b-vision-instruct"
  llm_text_model: "@cf/meta/llama-3.1-8b-instruct"
  llm_image_model: "@cf/black-forest-labs/flux-1-schnell"
  llm_base_url: ""
  llm_timeout: 120
